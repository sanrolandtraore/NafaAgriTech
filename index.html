<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NAFA - AGRITECH — La technologie au service de l'agriculture africaine</title>
    <meta name="description" content="NAFA - AGRITECH : La technologie au service de l'agriculture africaine. Plateforme agro-pastorale intégrée : gestion d'exploitations, planning cultural, élevage, santé animale, intrants et travaux mécanisés.">
    <meta name="author" content="NAFA - AGRITECH" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#166534" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NAFA - AGRITECH" />
    <meta name="application-name" content="NAFA - AGRITECH" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- Preconnect & DNS-Prefetch for Fast Asset Delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Canonical & SEO Robots -->
    <link rel="canonical" href="https://nafa-agritech.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nafa-agritech.com/" />
    <meta property="og:site_name" content="NAFA-AGRITECH" />
    <meta property="og:title" content="NAFA - AGRITECH — La technologie au service de l'agriculture africaine">
    <meta property="og:description" content="NAFA - AGRITECH : Solution numérique d'aide à la décision pour l'agriculture et l'élevage. Diagnostic, cartographie, conseils, irrigation et mise en relation avec des partenaires techniques qualifiés.">
    <meta property="og:image" content="https://nafa-agritech.com/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NAFA - AGRITECH — La technologie au service de l'agriculture africaine">
    <meta name="twitter:description" content="NAFA - AGRITECH : Solution numérique d'aide à la décision pour l'agriculture et l'élevage. Diagnostic, cartographie, conseils, irrigation et mise en relation avec des partenaires techniques qualifiés.">
    <meta name="twitter:image" content="https://nafa-agritech.com/logo.png" />
  </head>

  <body>
    <div id="root">
      <div id="nafa-boot-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f5;font-family:system-ui,sans-serif;color:#1f2937">
        <div style="text-align:center;padding:24px;max-width:360px">
          <div style="width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:#ffffff;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:2px solid rgba(22,101,52,0.18);overflow:hidden;padding:6px;display:flex;align-items:center;justify-content:center">
            <img src="/logo.png" alt="NAFA-AGRITECH" style="width:100%;height:100%;object-fit:contain;border-radius:16px" />
          </div>
          <div style="font-size:26px;font-weight:800;color:#166534;letter-spacing:-0.5px">NAFA - AGRITECH</div>
          <div style="margin-top:6px;font-size:14px;color:#15803d;font-weight:600">La technologie au service de l'agriculture africaine</div>
          <div style="margin-top:14px;font-size:12px;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:8px">
            <span style="display:inline-block;width:8px;height:8px;background:#15803d;border-radius:50%;animation:pulse 1.5s infinite"></span>
            Chargement de la plateforme en cours…
          </div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        window.clearNafaCacheAndReload = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) caches.delete(names[i]);
            });
          }
          try {
            sessionStorage.clear();
          } catch(e) {}
          setTimeout(function() {
            window.location.href = window.location.pathname + '?nocache=' + Date.now();
          }, 250);
        };

        function renderFallback(title, details) {
          var root = document.getElementById('root');
          if (!root) return;
          if (!root.querySelector('#nafa-boot-loader')) return;

          root.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f5;font-family:system-ui,-apple-system,sans-serif;color:#1f2937;padding:20px">
              <div style="text-align:center;padding:28px 24px;max-width:440px;background:#ffffff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.06);border:1px solid rgba(22,101,52,0.12)">
                <div style="width:72px;height:72px;margin:0 auto 16px;border-radius:20px;background:#ffffff;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:2px solid rgba(22,101,52,0.18);overflow:hidden;padding:6px;display:flex;align-items:center;justify-content:center">
                  <img src="/logo.png" alt="NAFA-AGRITECH" style="width:100%;height:100%;object-fit:contain;border-radius:14px" />
                </div>
                <div style="font-size:22px;font-weight:800;color:#166534;letter-spacing:-0.5px">NAFA - AGRITECH</div>
                <div style="margin-top:4px;font-size:13px;color:#15803d;font-weight:600">Plateforme Agricole & Pastorale Intégrée</div>
                
                <div style="margin:20px 0;padding:14px 16px;background:#fef3c7;border-radius:14px;border:1px solid #fde68a;color:#92400e;font-size:13px;line-height:1.5;text-align:left">
                  <strong>${title || 'Initialisation prolongée de la plateforme'}</strong>
                  <div style="margin-top:6px;font-size:12px;color:#b45309">
                    ${details || 'Si le chargement persiste, cela peut être dû au cache de votre navigateur. Cliquez ci-dessous pour actualiser.'}
                  </div>
                </div>

                <div style="display:flex;flex-direction:column;gap:10px">
                  <button onclick="window.location.reload()" style="background:#166534;color:#ffffff;border:none;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer">
                    Actualiser la plateforme
                  </button>
                  <button onclick="clearNafaCacheAndReload()" style="background:#f3f4f6;color:#374151;border:1px solid #d1d5db;padding:10px 18px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer">
                    Vider le cache local & recharger
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        window.addEventListener('error', function (event) {
          var err = event.error ? (event.error.message || String(event.error)) : (event.message || 'Erreur script');
          console.error('NAFA runtime error:', err);
          renderFallback('Incident lors du chargement', err);
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason ? (event.reason.message || String(event.reason)) : 'Erreur asynchrone';
          console.error('NAFA unhandled rejection:', reason);
          renderFallback('Initialisation interrompue', reason);
        });

        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.querySelector('#nafa-boot-loader')) {
            renderFallback(
              'Le chargement prend plus de temps que prévu...',
              'Une mise à jour ou un cache local peut ralentir le démarrage. Cliquez sur Actualiser ci-dessous.'
            );
          }
        }, 3600);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
