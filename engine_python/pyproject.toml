[project]
name = "nafa-agritech-engine"
version = "1.0.0"
description = "Noyau de calcul d'ingénierie agronomique, vétérinaire, modélisation 2D/3D et vision par ordinateur NAFA-AGRITECH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nafa"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
